name: CI

on:
  push:
    branches: [main]
  pull_request:

# İşler yalnız okur; gizli değerler PR'lara verilmez.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_SURUM: 28.2.13676358

jobs:
  arayuz:
    name: Arayüz ve betikler (alt modül)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kilit ve sürüm denetimi
        run: |
          node scripts/kilit-denetle.mjs
          node scripts/surum-denetle.mjs
          node --test "scripts/*.test.mjs"
      - run: pnpm --filter app check
      - run: pnpm --filter app test

  android:
    name: Android (clippy, test, debug APK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Linux bağımlılıkları (masaüstü geliştirme ikilisi ve host testleri için)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Kilit ve sürüm denetimi
        run: |
          node scripts/kilit-denetle.mjs
          node scripts/surum-denetle.mjs
      - name: Android SDK ve NDK
        # Çalıştırıcıda yoksa sdkmanager ile kurulur; NDK sürümü sabittir
        # (SQLCipher'in OpenSSL'i kaynaktan derlenir; cc ve openssl-src NDK'nın
        # clang'ını ve llvm-ar'ını ister).
        run: |
          SDK="$ANDROID_HOME"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$SDK/ndk/$NDK_SURUM" ] || yes | "$SDKM" --install "ndk;$NDK_SURUM" > /dev/null
          [ -d "$SDK/build-tools/36.0.0" ] || yes | "$SDKM" --install "build-tools;36.0.0" > /dev/null
          [ -d "$SDK/platforms/android-36" ] || yes | "$SDKM" --install "platforms;android-36" > /dev/null
          NDK="$SDK/ndk/$NDK_SURUM"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android24-clang"
          {
            echo "NDK_HOME=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Biçim
        run: cargo fmt --all -- --check
      - name: Android clippy
        run: cargo clippy --locked --target aarch64-linux-android -p mailhere-android --all-targets -- -D warnings
      - name: Masaüstüne özgü paket Android ağacında yok
        run: |
          if cargo tree --locked --target aarch64-linux-android -p mailhere-android -e normal --prefix none \
            | grep -E '^(keyring|tauri-plugin-updater|tauri-plugin-single-instance) '; then
            echo "Android bağımlılık ağacında masaüstüne özgü paket var"; exit 1
          fi
      - name: Host clippy ve testler
        run: |
          cargo clippy --locked -p mailhere-android --all-targets -- -D warnings
          cargo test --locked -p mailhere-android
      - name: Debug APK (arm64)
        run: pnpm tauri android build --apk --target aarch64 --debug
      - name: APK denetimi (paket, izinler, minSdk, ABI, 16 KB hizası)
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -ipath '*debug*' | head -1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          scripts/apk-denetle.sh "$APK" --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mailhere-android-debug
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
