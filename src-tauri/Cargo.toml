[package]
name = "mailhere-android"
description = "Mailhere Android kabuğu: tek pencere, anahtar kasası köprüsü, sistem bildirimi, paylaşım"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Android'de Gradle `libmailhere_lib.so`yu yükler (`tauri::mobile_entry_point`);
# masaüstünde geliştirme için aynı kabuk ikili olarak da açılır (src/main.rs).
[lib]
name = "mailhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mailhere-android"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
# Ortak çekirdek: git alt modülü (sabit commit), kendi çalışma alanı.
mh-app = { path = "../mailhere/crates/mh-app" }
mh-core = { path = "../mailhere/crates/mh-core" }
mh-sync = { path = "../mailhere/crates/mh-sync" }
mh-mime = { path = "../mailhere/crates/mh-mime" }
# Yanıt alıntısının tarihi (bildirimden yanıt; sürüm mailhere ile aynı).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["v4"] }
# Yalnız webview çalışma zamanı: tepsi, sıkıştırma, X11 gibi masaüstü
# özellikleri Android'de yok (sürüm mailhere ile aynı).
tauri = { version = "2.12.3", default-features = false, features = ["wry"] }
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-dialog = "2.8.2"
# Seçilen (content://) ve kaydedilen dosyalar yalnız Rust tarafından okunur/yazılır.
tauri-plugin-fs = "2.7.0"

[target.'cfg(target_os = "android")'.dependencies]
# logcat katmanı (MIT); süzgeç ortak katmanda (`mh_app::logging`).
tracing-android = "0.2.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Masaüstünde geliştirme ikilisi için pencere sistemi.
tauri = { version = "2.12.3", default-features = false, features = ["wry", "x11", "dbus"] }

[features]
# `pnpm tauri android build` bunu açar; geliştirmede devUrl kullanılır.
custom-protocol = ["tauri/custom-protocol"]
